# Builds VRift for Windows, Linux and macOS and publishes a GitHub release whenever the
# VERSION file changes on main. The release is tagged v<VERSION> (for example v1.0.1) and
# contains one zip per platform with the ready-to-run program (no installers).
#
# To release: edit VERSION (e.g. 1.0.1 -> 1.1.0), run `npm run version:sync`, commit, push.
# You can also start it by hand from the Actions tab ("Run workflow").
#
# Build cache: each platform restores its last build (cargo registry, src-tauri/target and
# node_modules), builds with it, and saves a new cache when something changed. If the build
# fails with the cache, the cache is thrown away and that platform builds again from scratch.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to replace a build cache that turned out broken

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION must look like 1.2.3 (got '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists - bump VERSION to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip == 'false'
        with:
          node-version: 20

      - name: Check version files match VERSION
        if: steps.v.outputs.skip == 'false'
        run: node scripts/sync-version.mjs --check

      - name: Create draft release
        id: release
        if: steps.v.outputs.skip == 'false'
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "VRift $TAG" \
            --generate-notes
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            build_args: --no-bundle
          - platform: ubuntu-22.04
            name: linux-x64
            build_args: --no-bundle
          # On macOS the ready-to-run form of an app is the VRift.app folder (not an installer).
          - platform: macos-latest
            name: macos-universal
            build_args: --target universal-apple-darwin --bundles app
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # --- build cache -----------------------------------------------------------

      - name: Cache keys
        id: key
        shell: bash
        run: |
          echo "rust=release-${{ matrix.name }}-$(rustc -V | cut -d' ' -f2)-${{ hashFiles('src-tauri/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
          echo "nm=nm-release-${{ matrix.name }}-node20-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: rc
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.key.outputs.rust }}
          restore-keys: release-${{ matrix.name }}-

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.key.outputs.nm }}

      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      # --- build (no installers) -------------------------------------------------

      - name: Build (with the cache)
        id: cached
        continue-on-error: true
        shell: bash
        run: npm run tauri build -- ${{ matrix.build_args }}

      - name: Build from scratch (the cached build failed)
        if: steps.cached.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::The ${{ matrix.name }} build with the cache failed; building again from scratch."
          rm -rf src-tauri/target node_modules
          npm ci
          npm run tauri build -- ${{ matrix.build_args }}

      - name: Drop the broken cache
        if: steps.cached.outcome == 'failure'
        shell: bash
        run: |
          [ "${{ steps.rc.outputs.cache-hit }}" = "true" ] && gh cache delete "${{ steps.key.outputs.rust }}" --repo "$GITHUB_REPOSITORY" || true
          [ "${{ steps.nm.outputs.cache-hit }}" = "true" ] && gh cache delete "${{ steps.key.outputs.nm }}" --repo "$GITHUB_REPOSITORY" || true

      - name: Save build cache
        if: steps.rc.outputs.cache-hit != 'true' || steps.cached.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.key.outputs.rust }}

      - name: Save node_modules
        if: steps.nm.outputs.cache-hit != 'true' || steps.cached.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.key.outputs.nm }}

      # --- zip ------------------------------------------------------------------

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "VRift-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = @("src-tauri/target/release/vrift.exe", "src-tauri/target/release/VRift.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Built VRift executable not found in src-tauri/target/release" }
          Copy-Item $exe "$dir/VRift.exe"
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item scripts/release/README-windows.txt "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -CompressionLevel Optimal
          "ZIP=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="VRift-$VERSION-${{ matrix.name }}"
          mkdir -p "$dir"
          bin=""
          for c in src-tauri/target/release/vrift src-tauri/target/release/VRift; do [ -f "$c" ] && bin="$c" && break; done
          [ -n "$bin" ] || { echo "::error::Built VRift binary not found"; exit 1; }
          cp "$bin" "$dir/vrift"
          chmod +x "$dir/vrift"
          cp LICENSE "$dir/LICENSE.txt"
          cp scripts/release/README-linux.txt "$dir/README.txt"
          zip -r -9 "$dir.zip" "$dir"
          echo "ZIP=$dir.zip" >> "$GITHUB_ENV"

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          dir="VRift-$VERSION-${{ matrix.name }}"
          mkdir -p "$dir"
          cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/VRift.app "$dir/"
          cp LICENSE "$dir/LICENSE.txt"
          cp scripts/release/README-macos.txt "$dir/README.txt"
          ditto -c -k --keepParent "$dir" "$dir.zip"
          echo "ZIP=$dir.zip" >> "$GITHUB_ENV"

      - name: Upload to release
        shell: bash
        run: gh release upload "v$VERSION" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup:
    needs: [prepare, build]
    if: failure() && needs.prepare.outputs.release_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete the draft release so the build can be retried
        run: gh release delete "v${{ needs.prepare.outputs.version }}" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}